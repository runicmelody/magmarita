name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile everything
        run: python -m compileall -q pykrita install.py tools
      - name: Keymap loads
        run: |
          python -c "import importlib.util as u; s=u.spec_from_file_location('k','pykrita/magmarita/keymap.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.APP_NAME, m.VERSION, len(m.SHORTCUTS), 'shortcuts')"
      - name: Build itch zip
        run: python tools/build_itch.py
      - uses: actions/upload-artifact@v4
        with:
          name: magmarita-zip
          path: dist/*.zip

  dryrun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - name: Install PyQt5 (plugin tests)
        run: python -m pip install --quiet PyQt5
      - name: Installer dry run (no Krita needed)
        run: python tests/test_installer.py
      - name: Plugin module tests
        run: python tests/test_plugin.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_itch.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
